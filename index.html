<!doctype html>
<html>
<head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <div class="container">
        <div class="auth-link">
            <a class="login" href="#">Для того чтобы оставить комметарий необходимо авторизоваться</a>
        </div>

        <form class="login-form" style="display: none">
            <h3>Вход</h3>
            <input type="text" class="login-login" placeholder="Логин" />
            <input type="password" class="login-password" placeholder="Пароль" />
            <button type="button" class="login-button">Войти</button>
        </form>

        <ul class="comments"></ul>

        <div class="add-form" style="display: none">
            <textarea
                class="add-form-text"
                placeholder="Введите ваш комментарий"
                rows="4"
            ></textarea>
            <div class="add-form-row">
                <button class="add-form-button">Написать</button>
            </div>
        </div>
    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
